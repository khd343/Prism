# 🎯 Scans — refresh the records from the PRISM Archive (ui/scan_records_job.py).
# Weekly, plus a manual "Run workflow" button. Commits ui/scan_records.json ONLY when a measured value
# changed; a failed run (missing secret, unreadable archive, a recipe changed since its design-period
# record, an archive whose newest copy is over 10 days old, a recipe changed after unseen windows were
# recorded without moving its design date past them, and since 2026-10-18 a copy whose inputs fail the feed's
# floors, a window where most of the market's share counts moved or most of a scan's matches lost a price, a
# missing or unreadable ui/scan_record_checks.json, and a month about to be written final with a named fall not
# yet checked by hand) fails visibly, writes nothing, and GitHub emails the repository owner.
name: Scan records

on:
  # Two Monday slots, neither on :00 or :30 (2026-10-07). GitHub's scheduled runs are best-effort:
  # delayed under load and sometimes dropped, most often on the busiest minutes. The second slot is a
  # catch-up, not a second opinion: the job writes nothing when no measured value changed, so on a
  # normal Monday it costs one idle minute, and on a dropped first slot it is the run that records.
  schedule:
    - cron: "23 3 * * 1"      # Mondays 03:23 UTC = 08:53 IST
    - cron: "47 5 * * 1"      # Mondays 05:47 UTC = 11:17 IST (catch-up)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: scan-records
  cancel-in-progress: false

jobs:
  measure:
    # Pinned, not ubuntu-latest (2026-10-08): GitHub moves ubuntu-latest to Ubuntu 26 from 2026-10-19,
    # and a job that writes the out-of-sample record must not change under us. 24.04 is supported
    # to 2029. Actions on v7, the Node-24 releases (v4 / v5 ran on the retired Node 20).
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip

      - name: Install the pinned engine
        run: pip install -r requirements.txt

      - name: Measure the scans on the archive
        env:
          ARCHIVE_INDEX_SHEET_ID: ${{ secrets.ARCHIVE_INDEX_SHEET_ID }}
          PYTHONUTF8: "1"
        run: python -m ui.scan_records_job

      - name: Commit the records if they changed
        run: |
          if git diff --quiet -- ui/scan_records.json; then
            echo "No measured value changed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ui/scan_records.json
          git commit -m "chore: 🎯 scan records refreshed from the PRISM Archive"
          # A push made meanwhile (yours, or the keepalive's) would reject a bare push: take it in
          # and retry, three times at most.
          for attempt in 1 2 3; do
            git pull --rebase origin "${GITHUB_REF_NAME}" && git push && exit 0
            sleep $((attempt * 10))
          done
          echo "push failed after three attempts" && exit 1
